    <script>
      // Start a new visit or reload at the hero; preserve section and history navigation.
      (() => {
        const isHome = location.pathname === '/' || location.pathname === '/index.html'
        const navigation = performance.getEntriesByType('navigation')[0]
        const startsAtTop = isHome && (!location.hash || location.hash === '#top') && navigation?.type !== 'back_forward'
        history.scrollRestoration = startsAtTop ? 'manual' : 'auto'
        if (startsAtTop) {
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
          let userInteracted = false
          const inputEvents = ['pointerdown', 'touchstart', 'wheel', 'keydown']
          const onInput = () => { userInteracted = true }
          inputEvents.forEach(event => window.addEventListener(event, onInput, { capture: true, passive: true }))
          // Fonts can trigger a late restoration; wait for their layout before
          // resuming native Back/Forward scrolling inside the current document.
          window.addEventListener('pageshow', () => {
            document.fonts.ready.then(() => {
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  history.scrollRestoration = 'auto'
                  // Cancel a cached restoration queued during the font swap.
                  requestAnimationFrame(() => {
                    if (!userInteracted && (!location.hash || location.hash === '#top')) window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
                    inputEvents.forEach(event => window.removeEventListener(event, onInput, true))
                  })
                })
              })
            })
          }, { once: true })
        }
        if (!startsAtTop || matchMedia('(prefers-reduced-motion: reduce)').matches) return
        // Prepare the entrance before the prerendered content can paint.
        document.documentElement.dataset.entrance = 'pending'
        // Keep the page readable if the application cannot load.
        setTimeout(() => {
          if (document.documentElement.dataset.entrance === 'pending') document.documentElement.dataset.entrance = 'complete'
        }, 2200)
      })()
    </script>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        html[data-entrance='pending'] .nav-inner,
        html[data-entrance='pending'] .hero-copy,
        html[data-entrance='pending'] .hero-bottom { opacity: 0; }
      }
    </style>
